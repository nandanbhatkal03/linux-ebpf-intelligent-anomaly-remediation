name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev linux-tools-generic make gcc
      - run: pip install -r requirements/python.txt
      - run: make -C ebpf && make -C collector      # compile-only: hosted runners cannot load BPF reliably
      - run: python3 -m pytest -q
