name: ci
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/python.txt
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev libelf-dev zlib1g-dev linux-tools-generic make gcc
      - name: Install Python dependencies
        run: python -m pip install -r requirements/python.txt
      - name: Build eBPF programs and collector
        run: make -C ebpf && make -C collector
      - name: Run test suite
        run: python -m pytest -q
